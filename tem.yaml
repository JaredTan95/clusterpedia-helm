# Source: clusterpedia/templates/apiserver-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-clusterpedia-apiserver
  namespace: default
  labels:
    app.kubernetes.io/name: clusterpedia
    helm.sh/chart: clusterpedia-2.6.3
    app.kubernetes.io/instance: test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v0.9.0"
    app: test-clusterpedia-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clusterpedia
      app.kubernetes.io/instance: test
      app: test-clusterpedia-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clusterpedia
        helm.sh/chart: clusterpedia-2.6.3
        app.kubernetes.io/instance: test
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "v0.9.0"
        app: test-clusterpedia-apiserver
    spec:
      
      initContainers:
      - name: check-storage
        image: docker.io/bitnamilegacy/mysql:8.0.40-debian-12-r5
        command: 
          - /bin/bash
          - -ec
          - |
            # Load YAML data into a Bash variable
            source /opt/scripts/parse-yaml.sh;
            create_variables /etc/clusterpedia/storage/internalstorage-config.yaml;
            if [ -z $password ]; then password=${DB_PASSWORD}; fi;
            until mysqladmin status -u${user} -p${password} --host=${host} --port=${port}; do
            echo waiting for database check && sleep 1; 
            done;
            echo 'DataBase OK ✓'
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-clusterpedia-internalstorage
                key: password
          - name: DB_DSN
            valueFrom:
              secretKeyRef:
                name: database-credentials
                key: DATABASE_DSN
        volumeMounts:
        - name: internalstorage-config
          mountPath: /etc/clusterpedia/storage
          readOnly: true
        - name: scripts
          mountPath: /opt/scripts
          readOnly: true
      containers:
      - name: test-clusterpedia-apiserver
        image: ghcr.io/clusterpedia-io/clusterpedia/apiserver:v0.9.0
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/apiserver
        - --secure-port=443
        - --storage-config=/etc/clusterpedia/storage/internalstorage-config.yaml
        - -v=3
        env:
        - name: CLUSTERPEDIA_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: test-clusterpedia-internalstorage
              key: password
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DATABASE_DSN
        
        - name: GODEBUG
          value: netdns=go
        volumeMounts:
        - name: internalstorage-config
          mountPath: /etc/clusterpedia/storage
          readOnly: true
      serviceAccountName: test-clusterpedia-apiserver
      volumes:
        - name: internalstorage-config
          configMap:
            name: test-clusterpedia-internalstorage
        - name: scripts
          configMap:
            name: test-clusterpedia-scripts
